
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Play Phirst Player</title>
  <meta name="description" content="Play Phirst Player online. Tap in and play.">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #FFFFFF;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background: #FFFFFF;
    }

    /* CENTERED GAME PAGE */

    .game-page {
      position: relative;
      width: calc(100% - 32px);
      max-width: 900px;
      margin: 0 auto;
      background: #FFFFFF;
    }

    /* GAME FRAME */

    .game-frame {
      display: block;
      width: 100%;
      height: 1400px;
      max-height: 1600px;
      border: none;
      background: #FFFFFF;
    }

    /* HOME LOGO BUTTON */

    .home-button {
      position: absolute;

      top: calc(env(safe-area-inset-top, 0px) + 105px);
      left: 68%;

      transform: translateX(-50%);

      z-index: 20;

      width: 58px;
      height: 80px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: none;
      border-radius: 0;

      box-shadow: none;

      text-decoration: none;
      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .home-button img {
      display: block;
      width: 48px;
      height: 76px;
      object-fit: contain;
    }

    .home-button:active {
      transform: translateX(-50%) scale(0.94);
    }

    /* SMALL PHONES */

    @media (max-width: 480px) {
      .game-page {
        width: 100%;
      }

      .game-frame {
        height: 1400px;
      }

      .home-button {
        top: calc(env(safe-area-inset-top, 0px) + 105px);
        left: 68%;
        width: 50px;
        height: 70px;
      }

      .home-button img {
        width: 43px;
        height: 66px;
      }
    }

    /* TABLETS AND DESKTOP */

    @media (min-width: 900px) {
      .game-page {
        width: 90%;
      }

      .game-frame {
        height: 1400px;
      }
    }
  </style>
</head>

<body>

  <main class="game-page">

    <!-- PHIRST PLAYER GAME -->
    <iframe
      class="game-frame"
      src="https://playerphirst.lovable.app"
      title="Phirst Player Game"
      allow="autoplay; fullscreen; gamepad; web-share; clipboard-write"
      allowfullscreen>
    </iframe>

    <!-- HOME LOGO BUTTON -->
    <a
      class="home-button"
      href="https://phirstplayer.com/"
      aria-label="Return to Phirst Player homepage"
      title="Home">

      <img
        src="../walking-logo.png"
        alt="Phirst Player Home">

    </a>

  </main>

</body>
</html>
