
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Play Phirst Player</title>
<meta name="description" content="Play Phirst Player online. Tap in and play.">
<meta name="theme-color" content="#FFFFFF">

<!-- GOOGLE ANALYTICS -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P9F3Y4GGLL"></script>
<script>
window.dataLayer = window.dataLayer || [];

function gtag() {
  dataLayer.push(arguments);
}

gtag('js', new Date());
gtag('config', 'G-P9F3Y4GGLL');
</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: #FFFFFF;
  font-family: Helvetica, Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

/* GAME WINDOW */
.game-frame {
  display: block;
  width: 100%;
  height: 78vh;
  height: 78dvh;
  border: none;
  background: #FFFFFF;
}

/* WHITE CANVAS UNDER GAME */
.shop-container {
  width: 100%;
  min-height: 90px;
  padding: 12px 15px 25px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: #FFFFFF;
}

/* SHOP BUTTON */
.shop-now-btn {
  display: inline-block;
  padding: 13px 35px;
  background: #000000;
  color: #FFFFFF;
  text-decoration: none;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1px;
  border: 1px solid #000000;
  border-radius: 4px;
  text-align: center;
}

.shop-now-btn:hover {
  background: #333333;
  color: #FFFFFF;
}

.shop-now-btn:active {
  background: #555555;
}
</style>
</head>

<body>

<!-- PHIRST PLAYER GAME -->
<iframe
  class="game-frame"
  src="https://playerphirst.lovable.app"
  title="Phirst Player Game"
  allow="autoplay; fullscreen; gamepad; web-share; clipboard-write"
  allowfullscreen>
</iframe>

<!-- SHOP BUTTON ON WHITE CANVAS -->
<section class="shop-container">
  <a
    href="https://phirstplayer.com/#merchandise"
    class="shop-now-btn">
    SHOP NOW
  </a>
</section>

<!-- FORWARD TRACKING PARAMETERS TO GAME -->
<script>
var gameFrame = document.querySelector('.game-frame');

gameFrame.src =
  'https://playerphirst.lovable.app' + location.search;
</script>

</body>
</html>
