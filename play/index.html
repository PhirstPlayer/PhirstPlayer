
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Play Phirst Player</title>

  <meta name="description" content="Play Phirst Player online. Tap in and play.">

  <meta name="theme-color" content="#54c8f0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #54c8f0;
    }

    .game-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: none;
      display: block;
      background: #54c8f0;
    }
  </style>
</head>

<body>

  <iframe
    class="game-frame"
    src="https://playerphirst.lovable.app"
    title="Phirst Player Game"
    allow="autoplay; fullscreen; gamepad; web-share; clipboard-write"
    allowfullscreen>
  </iframe>

</body>
</html>
