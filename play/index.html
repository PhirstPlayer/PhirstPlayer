
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Play Phirst Player</title>
<meta name="description" content="Play Phirst Player online. Tap in and play.">
<meta name="theme-color" content="#FFFFFF">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-P9F3Y4GGLL"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-P9F3Y4GGLL');
</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #FFFFFF;
  font-family: Helvetica, Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

.game-frame {
  display: block;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  border: none;
  background: #FFFFFF;
}

/* SHOP BUTTON */
.shop-container {
  position: fixed;
  top: 79%;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  z-index: 9999;
  pointer-events: none;
}

.shop-now-btn {
  display: inline-block;
  padding: 13px 35px;
  background: #000000;
  color: #FFFFFF;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1px;
  border: 1px solid #000000;
  border-radius: 4px;
  pointer-events: auto;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.shop-now-btn:hover {
  background: #333333;
  color: #FFFFFF;
}
</style>
</head>

<body>

<iframe
  class="game-frame"
  src="https://playerphirst.lovable.app"
  title="Phirst Player Game"
  allow="autoplay; fullscreen; gamepad; web-share; clipboard-write"
  allowfullscreen>
</iframe>

<div class="shop-container">
  <a
    href="https://phirstplayer.com/#merchandise"
    class="shop-now-btn">
    SHOP NOW
  </a>
</div>

<script>
var f = document.querySelector('.game-frame');
f.src = 'https://playerphirst.lovable.app' + location.search;
</script>

</body>
</html>
