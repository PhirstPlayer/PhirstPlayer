
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phirst Player | Players Circle</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  color: #111111;
  font-family: Arial, Helvetica, sans-serif;
}

.newsletter {
  max-width: 1100px;
  margin: 0 auto;
  padding: 25px 30px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
}

.newsletter h1 {
  font-size: 48px;
  font-weight: bold;
  margin: 0 0 45px;
}

.newsletter > p {
  font-size: 30px;
  line-height: 1.4;
  margin-bottom: 45px;
}

#subscribeForm {
  width: 100%;
}

#subscriberEmail {
  width: 100%;
  padding: 20px 24px;
  font-size: 26px;
  border: 2px solid #cbd5e1;
  border-radius: 6px;
  outline: none;
  margin-bottom: 30px;
}

#subscriberEmail:focus {
  border-color: #777777;
}

#subscribeButton {
  display: block;
  padding: 22px 48px;
  background: #000000;
  color: #ffffff;
  border: none;
  border-radius: 6px;
  font-size: 27px;
  font-weight: bold;
  cursor: pointer;
}

#subscribeButton:hover {
  background: #333333;
}

#subscribeButton:disabled {
  opacity: 0.65;
  cursor: wait;
}

#subscribeMessage {
  font-size: 24px;
  font-weight: bold;
  line-height: 1.5;
  margin-top: 30px;
}

#responseFrame {
  display: none;
  width: 0;
  height: 0;
  border: 0;
}

@media (max-width: 600px) {

  .newsletter {
    padding: 20px;
  }

  .newsletter h1 {
    font-size: 36px;
  }

  .newsletter > p {
    font-size: 21px;
  }

  #subscriberEmail {
    font-size: 20px;
  }

  #subscribeButton {
    font-size: 21px;
    width: 100%;
  }

  #subscribeMessage {
    font-size: 19px;
  }

}

</style>

</head>

<body>

<section class="newsletter">

  <h1>Welcome!</h1>

  <p>
    Aye P!! Subscribe to the Players Circle and stay updated.
  </p>

  <form id="subscribeForm">

    <input
      type="email"
      id="subscriberEmail"
      name="email"
      placeholder="EMAIL"
      autocomplete="email"
      required
    >

    <button type="submit" id="subscribeButton">
      SUBSCRIBE
    </button>

    <p
      id="subscribeMessage"
      role="status"
      aria-live="polite"
    ></p>

  </form>

</section>

<iframe
  id="responseFrame"
  name="responseFrame"
></iframe>


<script>

// ==========================================
// PHIRST PLAYER SUBSCRIPTION CONFIGURATION
// ==========================================

const SCRIPT_URL = "YOUR_DEPLOYED_GOOGLE_APPS_SCRIPT_URL";

const form = document.getElementById("subscribeForm");
const emailInput = document.getElementById("subscriberEmail");
const button = document.getElementById("subscribeButton");
const message = document.getElementById("subscribeMessage");
const responseFrame = document.getElementById("responseFrame");

let isSubmitting = false;
let activeToken = null;


// ==========================================
// SUBMIT SUBSCRIPTION
// ==========================================

form.addEventListener("submit", function(event) {

  event.preventDefault();

  if (isSubmitting) return;

  const email = emailInput.value.trim();

  if (!email) {
    message.textContent = "Please enter your email address.";
    message.style.color = "#c00020";
    return;
  }

  isSubmitting = true;

  const token = (
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  )
    ? window.crypto.randomUUID()
    : String(Date.now()) + Math.random().toString(36).slice(2);

  activeToken = token;

  button.disabled = true;
  button.textContent = "SUBMITTING...";

  message.textContent = "";
  message.style.color = "#111111";

  const formData = new URLSearchParams();

  formData.append("email", email);
  formData.append("callbackToken", token);

  const requestForm = document.createElement("form");

  requestForm.method = "POST";
  requestForm.action = SCRIPT_URL;
  requestForm.target = "responseFrame";
  requestForm.style.display = "none";

  const emailField = document.createElement("input");
  emailField.type = "hidden";
  emailField.name = "email";
  emailField.value = email;

  const tokenField = document.createElement("input");
  tokenField.type = "hidden";
  tokenField.name = "callbackToken";
  tokenField.value = token;

  requestForm.appendChild(emailField);
  requestForm.appendChild(tokenField);

  document.body.appendChild(requestForm);

  requestForm.submit();

  setTimeout(function() {
    requestForm.remove();
  }, 1000);

  // FALLBACK IF RESPONSE DOES NOT ARRIVE

  setTimeout(function() {

    if (isSubmitting && activeToken === token) {

      isSubmitting = false;
      activeToken = null;

      button.disabled = false;
      button.textContent = "SUBSCRIBE";

      message.textContent =
        "We couldn't confirm your subscription. Please try again.";

      message.style.color = "#c00020";
    }

  }, 30000);

});


// ==========================================
// RECEIVE GOOGLE APPS SCRIPT RESPONSE
// ==========================================

window.addEventListener("message", function(event) {

  const data = event.data;

  if (!data || data.type !== "playersCircleResponse") {
    return;
  }

  if (!isSubmitting || data.token !== activeToken) {
    return;
  }

  isSubmitting = false;
  activeToken = null;

  button.disabled = false;
  button.textContent = "SUBSCRIBE";

  message.textContent = data.message;

  if (data.success) {

    message.style.color = "#008000";
    form.reset();

  } else {

    message.style.color = "#c00020";

  }

});

</script>

</body>
</html>
