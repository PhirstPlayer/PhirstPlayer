<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Phirst Player — Tap in. Stay fly. Get access.">
  <title>Phirst Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      margin: 0;
      padding: 0;
    }

    /* HEADER */

    header {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid #dddddd;
    }

    header img {
      height: 60px;
      width: auto;
      max-width: 90%;
      object-fit: contain;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0;
    }

    /* SHOP */

    .shop {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }

    .product {
      flex: 1 1 300px;
      max-width: 450px;
      margin: 20px;
      border: 1px solid #eeeeee;
      padding: 20px;
      text-align: center;
    }

    .product img {
      max-width: 100%;
      height: auto;
    }

    /* PAYPAL */

    .paypal-form {
      display: inline-grid;
      justify-items: center;
      align-content: start;
      gap: 8px;
    }

    .paypal-button {
      text-align: center;
      border: none;
      border-radius: 4px;
      min-width: 186px;
      padding: 0 32px;
      height: 42px;
      font-weight: bold;
      background-color: #ffd140;
      color: #000000;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 20px;
      cursor: pointer;
    }

    .paypal-form > img {
      max-width: 100%;
      height: auto;
    }

    .paypal-powered {
      font-size: 12px;
    }

    .paypal-powered img {
      height: 14px;
      width: auto;
      vertical-align: middle;
    }

    /* PLAYERS CIRCLE SUBSCRIPTION */

    .players-circle-section {
      padding: 20px;
      background-color: #eff2f7;
    }

    .players-circle-container {
      text-align: left;
      background-color: #ffffff;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 3px;
      border: 1px solid #c0ccd9;
    }

    .players-circle-title {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 20px;
    }

    .players-circle-intro {
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 20px;
    }

    .players-circle-email {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      color: #000000;
      background-color: #ffffff;
      border: 1px solid #c0ccd9;
      border-radius: 3px;
    }

    .players-circle-email:focus {
      outline: none;
      border-color: #000000;
      box-shadow: 0 0 0 1px #000000;
    }

    .players-circle-submit {
      display: inline-block;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .players-circle-submit:hover {
      opacity: 0.8;
    }

    .players-circle-submit:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .players-circle-message {
      display: none;
      margin-top: 15px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .players-circle-frame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #dddddd;
      font-size: 14px;
    }

    .social-links a {
      margin: 0 10px;
      color: #000000;
      text-decoration: none;
    }

    .social-links a:hover {
      text-decoration: underline;
    }

    /* MOBILE RESPONSIVENESS */

    @media (max-width: 600px) {
      header img {
        height: 50px;
      }

      h1 {
        font-size: 26px;
      }

      .shop {
        padding: 10px;
      }

      .product {
        flex: 1 1 100%;
        width: 100%;
        margin: 10px 0;
      }

      .players-circle-section {
        padding: 10px;
      }

      .players-circle-container {
        padding: 25px 20px;
      }

      .players-circle-title {
        font-size: 28px;
        margin-bottom: 15px;
      }

      .players-circle-intro {
        font-size: 16px;
      }

      .players-circle-email {
        font-size: 16px;
        padding: 12px;
      }

      .players-circle-submit {
        width: 100%;
        font-size: 16px;
      }

      .social-links a {
        display: inline-block;
        margin: 5px 6px;
      }
    }

  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <img src="walking-logo.png" alt="Phirst Player Logo">
    <h1>PHIRST PLAYER</h1>
  </header>

  <main>

    <!-- PLAYERS CIRCLE INTRO -->

    <section style="text-align:center; padding:20px;">
      <h2>Welcome to the Players Circle</h2>
      <p>Tap in. Stay fly. Get access.</p>
    </section>

    <!-- SHOP -->

    <section class="shop">

      <!-- PRODUCT 1: EMBROIDERED TEE -->

      <div class="product">

        <img
          src="walking-logo.png"
          alt="Walking Figure Tee"
        >

        <h3>Embroidered Tee</h3>
        <p>$25.00</p>

        <form
          class="paypal-form"
          action="https://www.paypal.com/ncp/payment/RNCQVJL6UTK98"
          method="post"
          target="_blank"
        >

          <input
            class="paypal-button"
            type="submit"
            value="Buy Now"
          >

          <img
            src="https://www.paypalobjects.com/images/Debit_Credit_APM.svg"
            alt="Accepted payment methods"
          >

          <div class="paypal-powered">
            Powered by

            <img
              src="https://www.paypalobjects.com/paypal-ui/logos/svg/paypal-wordmark-color.svg"
              alt="PayPal"
            >
          </div>

        </form>

      </div>

      <!-- PRODUCT 2: GOD'S FAVORITE PLAYER TEE -->

      <div class="product">

        <img
          src="gods-favorite-player-tee.png"
          alt="God's Favorite Player Tee"
        >

        <h3>Vinyl Tee</h3>
        <p>$50.00</p>

        <form
          class="paypal-form"
          action="https://www.paypal.com/ncp/payment/EXNNPS2K9X7UN"
          method="post"
          target="_blank"
        >

          <input
            class="paypal-button"
            type="submit"
            value="Buy Now"
          >

          <img
            src="https://www.paypalobjects.com/images/Debit_Credit_APM.svg"
            alt="Accepted payment methods"
          >

          <div class="paypal-powered">
            Powered by

            <img
              src="https://www.paypalobjects.com/paypal-ui/logos/svg/paypal-wordmark-color.svg"
              alt="PayPal"
            >
          </div>

        </form>

      </div>

    </section>

    <!-- PLAYERS CIRCLE SUBSCRIPTION -->

    <section class="players-circle-section">

      <div class="players-circle-container">

        <h2 class="players-circle-title">
          Welcome!
        </h2>

        <p class="players-circle-intro">
          Aye P!! Subscribe to the Players Circle and stay updated.
        </p>

        <!-- SUBSCRIPTION FORM -->

        <form
          id="players-circle-form"
          action="https://script.google.com/macros/s/AKfycbz4PsD4xvVzoyw6vBnfiRmNBNlSOFOeiZgATOAqvBt5-ZGD-5HeOBKNfdcjE_dfieYi/exec"
          method="POST"
          target="players-circle-frame"
        >

          <input
            type="email"
            name="email"
            id="players-circle-email"
            class="players-circle-email"
            placeholder="EMAIL"
            autocomplete="email"
            required
          >

          <button
            id="players-circle-submit"
            class="players-circle-submit"
            type="submit"
          >
            SUBSCRIBE
          </button>

        </form>

        <!-- RESPONSE MESSAGE -->

        <div
          id="players-circle-message"
          class="players-circle-message"
          role="status"
          aria-live="polite"
        ></div>

        <!-- HIDDEN RESPONSE FRAME -->

        <iframe
          name="players-circle-frame"
          id="players-circle-frame"
          class="players-circle-frame"
          title="Players Circle response"
          aria-hidden="true"
        ></iframe>

      </div>

    </section>

  </main>

  <!-- FOOTER -->

  <footer>

    <div class="social-links">

      <a
        href="https://www.instagram.com/phirstplayer"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

      |

      <a
        href="https://x.com/phirstplayer"
        target="_blank"
        rel="noopener noreferrer"
      >
        Twitter (X)
      </a>

      |

      <a
        href="https://youtube.com/@PhirstPlayer"
        target="_blank"
        rel="noopener noreferrer"
      >
        YouTube
      </a>

      |

      <a
        href="https://tiktok.com/@phirstplayer"
        target="_blank"
        rel="noopener noreferrer"
      >
        TikTok
      </a>

    </div>

    <p>
      Contact:

      <a href="mailto:support@phirstplayer.com">
        support@phirstplayer.com
      </a>
    </p>

  </footer>

  <!-- PLAYERS CIRCLE SUBSCRIPTION SCRIPT -->

  <script>

  (function () {

    "use strict";

    const form = document.getElementById("players-circle-form");
    const emailInput = document.getElementById("players-circle-email");
    const submitButton = document.getElementById("players-circle-submit");
    const message = document.getElementById("players-circle-message");

    let currentToken = "";
    let isSubmitting = false;
    let submissionTimer = null;

    function resetButton() {

      isSubmitting = false;

      submitButton.disabled = false;
      submitButton.textContent = "SUBSCRIBE";

      if (submissionTimer) {
        clearTimeout(submissionTimer);
        submissionTimer = null;
      }

    }

    function showMessage(text, success) {

      message.style.display = "block";

      message.style.color = success ? "#000000" : "#b00020";

      message.textContent = text;

    }

    form.addEventListener("submit", function(event) {

      if (isSubmitting) {
        event.preventDefault();
        return;
      }

      if (!form.reportValidity()) {
        event.preventDefault();
        return;
      }

      isSubmitting = true;

      currentToken =
        Date.now() + "-" +
        Math.random().toString(36).substring(2);

      let tokenInput = form.querySelector(
        'input[name="callbackToken"]'
      );

      if (!tokenInput) {

        tokenInput = document.createElement("input");

        tokenInput.type = "hidden";
        tokenInput.name = "callbackToken";

        form.appendChild(tokenInput);

      }

      tokenInput.value = currentToken;

      submitButton.disabled = true;
      submitButton.textContent = "SUBMITTING...";

      showMessage("Submitting your subscription...", true);

      submissionTimer = setTimeout(function() {

        if (!isSubmitting) return;

        resetButton();

        showMessage(
          "We couldn't confirm your subscription yet. " +
          "Please try again in a moment.",
          false
        );

      }, 30000);

    });


    // RECEIVE RESPONSE FROM APPS SCRIPT

    window.addEventListener("message", function(event) {

      const data = event.data;

      if (!data || typeof data !== "object") return;

      if (data.type !== "playersCircleResponse") return;

      if (!isSubmitting) return;

      if (data.token !== currentToken) return;

      resetButton();

      showMessage(
        data.message || "Subscription response received.",
        data.success === true
      );

      if (data.success === true) {

        emailInput.value = "";

      }

    });

  })();

  </script>

</body>
</html>
